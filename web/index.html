  // ---------- tabs + dock ----------
  const TABS = [['today', 'sun', 'Today'], ['week', 'calendar', 'Week'], ['settings', 'sliders', 'Settings']];
  function setupDock() {
    $('#fab').innerHTML = icon('plus', 'lg');
    $('.ask-orb-slot').innerHTML = orb(24, { rings: false, glass: false });
    $('.ask-bar .sparkle').innerHTML = icon('sparkles');
    document.querySelectorAll('.tab').forEach((b) => {
      const t = TABS.find((x) => x[0] === b.dataset.tab);
      b.innerHTML = icon(t[1]) + '<span>' + t[2] + '</span>';
      b.setAttribute('aria-label', t[2]);
    });
    updateTabbar();
  }
  function updateTabbar() {
    const index = TABS.findIndex((t) => t[0] === state.tab);
    $('.tabbar').style.setProperty('--tab', index);
    document.querySelectorAll('.tab').forEach((b) => {
      const on = b.dataset.tab === state.tab;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
    });
  }
  function switchTab(tab) {
    if (tab === state.tab) {
      if ($('#dock').classList.contains('min')) $('#dock').classList.remove('min');
      window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
      return;
    }
    const order = TABS.map((t) => t[0]);
    const dir = order.indexOf(tab) > order.indexOf(state.tab) ? 'fwd' : 'back';
    haptic();
    state.tab = tab;
    updateTabbar();
    Store.writePref('tab', tab);
    transition(() => {
      for (const [name, el] of Object.entries(views)) el.hidden = name !== tab;
      render({ enter: !supportsVT });
      window.scrollTo(0, 0);
      $('#dock').classList.remove('min');
    }, 'tab-' + dir);
  }
  let lastY = 0;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    const dock = $('#dock');
    if (y > lastY + 6 && y > 90) dock.classList.add('min');
    else if (y < lastY - 6 || y < 40) dock.classList.remove('min');
    lastY = y;
  }, { passive: true });

  // ---------- sheets ----------
  const layer = $('#sheet-layer');
  const sheet = $('#sheet');
  let sheetKind = null, sheetCleanup = null;
  function openSheet(kind, html, label, onMount) {
    closeMenu();
    if (typeof sheetCleanup === 'function') sheetCleanup();
    sheetCleanup = null;
    sheetKind = kind;
    sheet.innerHTML = '<div class="grabber" aria-hidden="true"></div>' + html;
    sheet.setAttribute('aria-label', label);
    sheet.style.removeProperty('--drag');
    layer.hidden = false;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
    sheetCleanup = onMount ? onMount(sheet) : null;
    attachSheetDrag();
    Orbs.start();
  }
  function closeSheet() {
    if (!sheetKind) return;
    if (sheetKind === 'ask') { Orbs.thinking = false; }
    sheetKind = null;
    layer.classList.remove('open');
    document.body.style.overflow = '';
    if (typeof sheetCleanup === 'function') sheetCleanup();
    sheetCleanup = null;
    setTimeout(() => { if (!sheetKind) { layer.hidden = true; sheet.innerHTML = ''; } }, 450);
  }
  function attachSheetDrag() {
    const handle = sheet.querySelector('.sheet-head');
    const grab = sheet.querySelector('.grabber');
    let y0 = null, dy = 0;
    const down = (e) => { if (e.target.closest('button, input, textarea, select')) return; y0 = e.clientY; dy = 0; sheet.classList.add('dragging'); };
    const move = (e) => {
      if (y0 === null) return;
      dy = Math.max(0, e.clientY - y0);
      sheet.style.setProperty('--drag', dy + 'px');
    };
    const up = () => {
      if (y0 === null) return;
      y0 = null;
      sheet.classList.remove('dragging');
      if (dy > 120) closeSheet(); else sheet.style.setProperty('--drag', '0px');
    };
    for (const el of [handle, grab]) {
      if (!el) continue;
      el.addEventListener('pointerdown', down);
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    const prev = sheetCleanup;
    sheetCleanup = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (typeof prev === 'function') prev();
    };
  }
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      layer.style.setProperty('--kb', kb > 60 ? kb + 'px' : '0px');
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }

  // ---- editor ----
  const DURATIONS = [15, 30, 45, 60, 90, 120, 180];
  const pad = (n) => String(n).padStart(2, '0');
  const dateValue = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const timeValue = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());

  function openEditor(plan, defaultStart) {
    const editing = !!plan;
    const start = editing ? new Date(plan.start) : defaultStart;
    const draft = {
      title: editing ? plan.title : '', notes: editing ? plan.notes || '' : '',
      date: dateValue(start), time: timeValue(start), anytime: editing ? !!plan.anytime : false,
      duration: editing ? plan.duration : 30, category: editing ? plan.category : 'personal',
      priority: editing ? plan.priority : 1, touched: editing,
    };
    const html = '<div class="sheet-head">' +
      '<button class="round big" data-action="close-sheet" aria-label="Cancel">' + icon('x') + '</button>' +
      '<h2>' + (editing ? 'Edit Plan' : 'New Plan') + '</h2>' +
      '<button class="round big save-btn" id="ed-save" aria-label="Save">' + icon('check') + '</button></div>' +
      '<div class="sheet-scroll"><form class="form" id="ed-form" autocomplete="off">' +
      '<div class="ed-title pane tinted" id="ed-title-box"><span class="cat-ic ink" id="ed-cat-ic"></span>' +
      '<textarea id="ed-title" rows="1" placeholder="What’s the plan?" maxlength="300" aria-label="Title"></textarea></div>' +
      '<div class="chips" id="ed-cats" role="radiogroup" aria-label="Category"></div>' +
      '<div class="box pane">' +
      '<label class="line"><span class="label">' + icon('sunset', 'sm') + 'Anytime that day</span><input class="sw" id="ed-anytime" type="checkbox" role="switch"></label>' +
      '<div class="line"><span class="label">' + icon('calendar', 'sm') + 'Date</span><input class="input" id="ed-date" type="date" required></div>' +
      '<div class="line" id="ed-time-line"><span class="label">' + icon('clock', 'sm') + 'Time</span><input class="input" id="ed-time" type="time"></div>' +
      '<div id="ed-dur-line"><div class="line" style="min-height:44px"><span class="label">' + icon('hourglass', 'sm') + 'Duration</span></div><div class="durations" id="ed-durs"></div></div>' +
      '</div>' +
      '<div class="box pane"><div class="line" style="min-height:44px"><span class="label">' + icon('flagLine', 'sm') + 'Priority</span></div>' +
      '<div class="seg" id="ed-pri" role="radiogroup" aria-label="Priority"><span class="seg-thumb"></span>' +
      ['Low', 'Normal', 'High'].map((t, k) => '<button type="button" data-pri="' + k + '" role="radio">' + t + '</button>').join('') + '</div>' +
      '<div class="line"><textarea class="notes" id="ed-notes" placeholder="Notes" maxlength="4000" aria-label="Notes"></textarea></div></div>' +
      (editing ? '<button type="button" class="btn btn-soft btn-wide danger-btn" id="ed-delete">' + icon('trash', 'sm') + 'Delete plan</button>' : '') +
      '</form></div>';

    openSheet('editor', html, editing ? 'Edit plan' : 'New plan', (root) => {
      const title = $('#ed-title', root), notes = $('#ed-notes', root);
      title.value = draft.title;
      notes.value = draft.notes;
      $('#ed-date', root).value = draft.date;
      $('#ed-time', root).value = draft.time;
      $('#ed-anytime', root).checked = draft.anytime;
      const autosize = () => { title.style.height = 'auto'; title.style.height = title.scrollHeight + 'px'; };

      function paint() {
        const c = cat(draft.category);
        $('#ed-title-box', root).style.setProperty('--tint', c.color);
        $('#ed-cat-ic', root).innerHTML = icon(c.icon, 'lg');
        $('#ed-cats', root).innerHTML = Object.entries(CATEGORIES).map(([id, cc]) =>
          '<button type="button" class="chip' + (id === draft.category ? ' on' : '') + '" style="--tint:' + cc.color + '" data-cat="' + id + '" role="radio" aria-checked="' + (id === draft.category) + '">' + icon(cc.icon, 'sm') + cc.title + '</button>').join('');
        const options = Array.from(new Set(DURATIONS.concat([draft.duration]))).sort((x, y) => x - y);
        $('#ed-durs', root).innerHTML = options.map((m) => '<button type="button" class="dur' + (m === draft.duration ? ' on' : '') + '" data-dur="' + m + '">' + Fmt.duration(m) + '</button>').join('');
        $('#ed-pri', root).style.setProperty('--i', draft.priority);
        root.querySelectorAll('#ed-pri button').forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.pri) === draft.priority)));
        $('#ed-time-line', root).hidden = draft.anytime;
        $('#ed-dur-line', root).hidden = draft.anytime;
        $('#ed-save', root).disabled = !title.value.trim();
        $('#ed-save', root).style.opacity = title.value.trim() ? '1' : '.45';
      }
      paint();
      requestAnimationFrame(autosize);

      title.addEventListener('input', () => {
        autosize();
        let guessed = false;
        if (!draft.touched) {
          const guess = Parser.guessCategory(title.value);
          if (guess && guess !== draft.category) { draft.category = guess; draft.duration = CATEGORIES[guess].duration; guessed = true; }
        }
        paint();
        if (guessed) {
          const chip = $('#ed-cats .chip.on', root);
          if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduceMotion.matches ? 'auto' : 'smooth' });
        }
      });
      title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
      $('#ed-anytime', root).addEventListener('change', (e) => { draft.anytime = e.target.checked; haptic(); paint(); });
      root.addEventListener('click', (e) => {
        const chip = e.target.closest('[data-cat]');
        if (chip) { draft.category = chip.dataset.cat; draft.touched = true; haptic(); paint(); return; }
        const dur = e.target.closest('[data-dur]');
        if (dur) { draft.duration = Number(dur.dataset.dur); haptic(); paint(); return; }
        const pri = e.target.closest('[data-pri]');
        if (pri) { draft.priority = Number(pri.dataset.pri); haptic(); paint(); }
      });
      $('#ed-form', root).addEventListener('submit', (e) => { e.preventDefault(); save(); });
      $('#ed-save', root).addEventListener('click', save);
      const del = $('#ed-delete', root);
      if (del) {
        let armed = false, timer = 0;
        del.addEventListener('click', () => {
          if (!armed) {
            armed = true;
            del.innerHTML = icon('trash', 'sm') + 'Tap again to delete';
            timer = setTimeout(() => { armed = false; del.innerHTML = icon('trash', 'sm') + 'Delete plan'; }, 3000);
            return;
          }
          clearTimeout(timer);
          closeSheet();
          transition(() => { Store.deletePlan(plan.id); render(); }, 'data');
          toast('Deleted ' + plan.title);
        });
      }
      if (!editing) setTimeout(() => title.focus({ preventScroll: true }), 380);

      function save() {
        const text = title.value.trim();
        if (!text) { title.focus(); return; }
        const dateStr = $('#ed-date', root).value || draft.date;
        const timeStr = $('#ed-time', root).value || '09:00';
        const [y, m, d] = dateStr.split('-').map(Number);
        const [hh, mm] = timeStr.split(':').map(Number);
        const when = draft.anytime ? new Date(y, m - 1, d) : new Date(y, m - 1, d, hh, mm);
        if (Number.isNaN(when.getTime())) { toast('Pick a valid date.', true); return; }
        const next = Object.assign({}, editing ? plan : { id: C.newId(), done: false, completedAt: null, createdAt: new Date().toISOString() }, {
          title: text, notes: notes.value.trim(), start: when.toISOString(), anytime: draft.anytime,
          duration: draft.duration, category: draft.category, priority: draft.priority,
        });
        closeSheet();
        transition(() => { Store.putPlan(next); render(); }, 'data');
        toast((editing ? 'Saved ' : 'Added ') + next.title);
      }
      return null;
    });
  }

  // ---- ask jarvis ----
  const SUGGESTIONS = [
    ['What’s on today?', 'sun', 'var(--cyan)', true],
    ['Am I free tomorrow afternoon?', 'hourglass', 'var(--green)', true],
    ['Gym tomorrow at 7am for 1h', 'activity', '#2FD69A', false],
    ['Dinner with Sam Friday 8pm', 'fork', '#FF5C9D', false],
    ['Brief me on my week', 'calendar', 'var(--violet)', true],
    ['Finish report by Thursday 5pm!', 'flag', 'var(--orange)', false],
  ];
  const chat = { messages: [], thinking: false };

  function previewFor(intent) {
    const now = new Date();
    switch (intent.type) {
      case 'add': {
        const p = intent.plan, c = cat(p.category);
        const bits = [cap(Briefing.dayPhrase(p.start, now).replace(/^on /, ''))];
        if (p.hasTime) bits.push(Fmt.time(p.start), Fmt.duration(p.duration)); else bits.push('Anytime');
        bits.push(c.title);
        return { icon: c.icon, tint: c.color, text: p.title + ' — ' + bits.join(' · ') };
      }
      case 'day': return { icon: 'chat', tint: 'var(--cyan)', text: 'Brief you on ' + Briefing.dayPhrase(intent.day, now).replace(/^on /, '') };
      case 'week': return { icon: 'calendar', tint: 'var(--cyan)', text: 'Brief you on the week' };
      case 'free': return { icon: 'hourglass', tint: 'var(--green)', text: 'Find free time ' + Briefing.dayPhrase(intent.day, now) };
      case 'name': return { icon: 'user', tint: 'var(--violet)', text: 'Call you ' + intent.name };
      default: return null;
    }
  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function messageHTML(m) {
    if (m.role === 'user') return '<div class="msg user" data-mid="' + m.id + '"><div class="bubble"></div></div>';
    let extra = '';
    if (m.plan) {
      const c = cat(m.plan.category);
      const bits = [cap(Briefing.dayPhrase(new Date(m.plan.start), new Date()).replace(/^on /, ''))];
      if (!m.plan.anytime) bits.push(Fmt.time(new Date(m.plan.start)), Fmt.duration(m.plan.duration));
      bits.push(c.title);
      extra = '<div class="summary' + (m.undone ? ' undone' : '') + '" style="--tint:' + c.color + '"><span class="cat-ic ink">' + icon(c.icon, 'sm') + '</span><span><b></b><small>' + esc(bits.join(' · ')) + '</small></span>' +
        (m.plan.priority === 2 ? '<span class="flag">' + icon('flag', 'sm') + '</span>' : '') + '</div>' +
        (m.undone ? '' : '<button class="undo" data-action="undo" data-mid="' + m.id + '">' + icon('undo', 'sm') + 'Undo</button>');
    }
    return '<div class="msg jarvis" data-mid="' + m.id + '">' + orb(26, { rings: false, glass: false }) + '<div class="bubble pane"><span class="txt"></span>' + extra + '</div></div>';
  }
  function mountMessage(list, m, animateText) {
    list.insertAdjacentHTML('beforeend', messageHTML(m));
    const node = list.lastElementChild;
    if (m.role === 'user') node.querySelector('.bubble').textContent = m.text;
    else {
      const b = node.querySelector('.summary b');
      if (b) b.textContent = m.plan.title;
      if (!animateText) typed.add(m.id);
      typewrite(node.querySelector('.txt'), m.text, m.id);
    }
    return node;
  }

  function openAsk(prefill) {
    if (!chat.messages.length) {
      chat.messages.push({ id: 'm' + Date.now(), role: 'jarvis', text: Briefing.greeting(new Date(), state.settings.name) + ". Tell me what's coming up and I'll slot it in — or ask me about your day." });
    }
    const html = '<div class="sheet-head"><button class="round big" data-action="close-sheet" aria-label="Close">' + icon('x') + '</button><h2></h2><span></span></div>' +
      '<div class="sheet-scroll" id="ask-scroll"><div class="ask-orb">' + orb(104) + '</div><div class="chat" id="chat" aria-live="polite"></div>' +
      '<div id="thinking"></div><div class="suggest" id="suggest"></div></div>' +
      '<div class="sheet-foot composer"><div class="preview pane tinted hide" id="ask-preview"><span class="pv-ic"></span><span class="pv-text"></span></div>' +
      '<form class="field-row" id="ask-form"><input class="ask-input" id="ask-input" type="text" enterkeyhint="send" autocomplete="off" placeholder="“Dentist Friday at 3pm”" aria-label="Message Jarvis" maxlength="300">' +
      '<button class="send" type="submit" aria-label="Send">' + icon('up') + '</button></form></div>';

    openSheet('ask', html, 'Ask Jarvis', (root) => {
      const list = $('#chat', root), scroll = $('#ask-scroll', root), input = $('#ask-input', root), form = $('#ask-form', root);
      const preview = $('#ask-preview', root), suggest = $('#suggest', root);
      chat.messages.forEach((m, k) => mountMessage(list, m, k === chat.messages.length - 1 && !typed.has(m.id)));
      const showSuggestions = () => {
        const show = chat.messages.length <= 1 && !chat.thinking;
        suggest.innerHTML = show ? SUGGESTIONS.map(([t, ic, tint, now], k) =>
          '<button class="sg pane" data-sg="' + k + '" style="color:inherit"><span style="color:' + tint + '">' + icon(ic) + '</span><span>' + esc(t) + '</span></button>').join('') : '';
      };
      showSuggestions();
      const toBottom = (smooth) => scroll.scrollTo({ top: scroll.scrollHeight, behavior: smooth && !reduceMotion.matches ? 'smooth' : 'auto' });
      requestAnimationFrame(() => toBottom(false));

      const updatePreview = () => {
        const text = input.value.trim();
        form.classList.toggle('has-text', !!text);
        const pv = text ? previewFor(Parser.interpret(text, new Date(), state.firstDay)) : null;
        if (pv) {
          preview.style.setProperty('--tint', pv.tint);
          $('.pv-ic', preview).innerHTML = icon(pv.icon, 'sm');
          $('.pv-ic', preview).style.color = pv.tint;
          $('.pv-text', preview).textContent = pv.text;
        }
        preview.classList.toggle('hide', !pv);
      };
      input.addEventListener('input', updatePreview);

      async function send(text) {
        text = (text || '').trim();
        if (!text || chat.thinking) return;
        const intent = Parser.interpret(text, new Date(), state.firstDay);
        input.value = '';
        updatePreview();
        const userMsg = { id: 'm' + Date.now(), role: 'user', text };
        chat.messages.push(userMsg);
        mountMessage(list, userMsg, false);
        chat.thinking = true;
        Orbs.thinking = true;
        showSuggestions();
        $('#thinking', root).innerHTML = '<div class="msg jarvis">' + orb(26, { rings: false, glass: false }) + '<div class="bubble pane"><span class="typing"><i></i><i></i><i></i></span></div></div>';
        toBottom(true);
        await sleep(650);
        if (sheetKind !== 'ask') { chat.thinking = false; Orbs.thinking = false; return; }
        const reply = respond(intent);
        chat.thinking = false;
        Orbs.thinking = false;
        $('#thinking', root).innerHTML = '';
        chat.messages.push(reply);
        mountMessage(list, reply, true);
        toBottom(true);
        if (state.settings.voice) Voice.speak(reply.text);
      }
      form.addEventListener('submit', (e) => { e.preventDefault(); haptic(); send(input.value); });
      root.addEventListener('click', (e) => {
        const sg = e.target.closest('[data-sg]');
        if (sg) {
          const s = SUGGESTIONS[Number(sg.dataset.sg)];
          haptic();
          if (s[3]) send(s[0]);
          else { input.value = s[0]; updatePreview(); input.focus(); }
          return;
        }
        const undo = e.target.closest('[data-action="undo"]');
        if (undo) {
          e.stopPropagation();
          const m = chat.messages.find((x) => x.id === undo.dataset.mid);
          if (!m || !m.plan || m.undone) return;
          m.undone = true;
          Store.deletePlan(m.plan.id);
          render();
          const node = list.querySelector('[data-mid="' + m.id + '"]');
          if (node) { node.querySelector('.summary').classList.add('undone'); undo.remove(); }
          const r = { id: 'm' + Date.now(), role: 'jarvis', text: 'Removed. As if it never happened.' };
          chat.messages.push(r);
          mountMessage(list, r, true);
          toBottom(true);
          haptic();
        }
      });
      if (prefill) { input.value = prefill; updatePreview(); }
      return null;
    });
  }

  function respond(intent) {
    const now = new Date();
    const id = 'm' + Date.now() + 'r';
    switch (intent.type) {
      case 'add': {
        const p = intent.plan;
        const plan = {
          id: C.newId(), title: p.title, notes: '', start: (p.hasTime ? p.start : D.startOfDay(p.start)).toISOString(),
          duration: p.duration, anytime: !p.hasTime, category: p.category, priority: p.priority,
          done: false, completedAt: null, createdAt: now.toISOString(),
        };
        Store.putPlan(plan);
        render();
        return { id, role: 'jarvis', text: Briefing.confirmation(p, now), plan };
      }
      case 'day': return { id, role: 'jarvis', text: Briefing.day(intent.day, dayAgenda(intent.day), now) };
      case 'week': {
        const days = D.weekDays(intent.day, state.firstDay).map((day) => ({ day, items: dayAgenda(day) }));
        return { id, role: 'jarvis', text: Briefing.week(days, now) };
      }
      case 'free': return { id, role: 'jarvis', text: Briefing.freeTime(intent.day, dayAgenda(intent.day), now, intent.period) };
      case 'name':
        state.settings.name = intent.name;
        Store.putSettings();
        render();
        return { id, role: 'jarvis', text: 'Very well. I’ll call you ' + intent.name + ' from now on.' };
      default:
        return { id, role: 'jarvis', text: 'I didn’t quite catch that. Try something like “Gym tomorrow at 7am”.' };
    }
  }

  // ---- backup restore ----
  function openRestore() {
    const html = '<div class="sheet-head"><button class="round big" data-action="close-sheet" aria-label="Cancel">' + icon('x') + '</button><h2>Restore Backup</h2><span></span></div>' +
      '<div class="sheet-scroll"><div class="form"><p class="note">Paste a backup you copied from Jarvis. Plans with the same ID are replaced; everything else is kept.</p>' +
      '<div class="box pane"><textarea class="notes" id="restore-text" style="min-height:220px" placeholder="Paste backup here" aria-label="Backup text"></textarea></div>' +
      '<button class="btn btn-primary btn-wide" id="restore-go">' + icon('restore', 'sm') + 'Restore plans</button></div></div>';
    openSheet('restore', html, 'Restore backup', (root) => {
      $('#restore-go', root).addEventListener('click', () => {
        let list;
        try { list = JSON.parse($('#restore-text', root).value); } catch (e) { toast('That doesn’t look like a Jarvis backup.', true); return; }
        if (list && Array.isArray(list.plans)) list = list.plans;
        if (!Array.isArray(list)) { toast('That doesn’t look like a Jarvis backup.', true); return; }
        let n = 0;
        for (const p of list) {
          if (p && typeof p.id === 'string' && typeof p.title === 'string' && !Number.isNaN(new Date(p.start).getTime())) { Store.putPlan(p); n++; }
        }
        closeSheet();
        render();
        toast('Restored ' + Fmt.count(n, 'plan'));
      });
      return null;
    });
  }

  // ---------- context menu ----------
  const menuLayer = $('#menu-layer');
  function openMenu(planId, anchor) {
    const plan = state.plans.get(planId);
    if (!plan) return;
    haptic();
    const r = anchor.getBoundingClientRect();
    const items = [
      ['edit', 'pencil', 'Edit'],
      ['toggle', 'done', plan.done ? 'Mark as not done' : 'Mark as done'],
      ['tomorrow', 'turn', 'Move to tomorrow'],
      ['duplicate', 'copy', 'Duplicate'],
      ['hr'],
      ['delete', 'trash', 'Delete'],
    ];
    menuLayer.innerHTML = '<div class="menu glass" role="menu">' + items.map((it) => it[0] === 'hr' ? '<hr>' :
      '<button role="menuitem" data-menu="' + it[0] + '"' + (it[0] === 'delete' ? ' class="danger-btn"' : '') + '>' + icon(it[1], 'sm') + esc(it[2]) + '</button>').join('') + '</div>';
    menuLayer.hidden = false;
    const menu = menuLayer.firstChild;
    const w = 236, h = 6 * 46 + 22;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = Math.min(Math.max(12, r.right - w), vw - w - 12);
    let top = r.bottom + 8;
    let originY = '0%';
    if (top + h > vh - 12) { top = Math.max(12, r.top - h - 8); originY = '100%'; }
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.setProperty('--ox', Math.min(100, Math.max(0, ((r.left + r.width / 2 - left) / w) * 100)) + '%');
    menu.style.setProperty('--oy', originY);
    menu.dataset.id = planId;
    const firstItem = menu.querySelector('button');
    if (firstItem) firstItem.focus({ preventScroll: true });
  }
  function closeMenu() { menuLayer.hidden = true; menuLayer.innerHTML = ''; }
  menuLayer.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-menu]');
    const id = menuLayer.firstChild && menuLayer.firstChild.dataset.id;
    closeMenu();
    if (!btn || !id) return;
    const plan = state.plans.get(id);
    if (!plan) return;
    const action = btn.dataset.menu;
    if (action === 'edit') openEditor(plan);
    else if (action === 'toggle') toggleDone(id);
    else if (action === 'tomorrow') {
      transition(() => { Store.putPlan(Object.assign({}, plan, { start: D.addDays(new Date(plan.start), 1).toISOString(), done: false, completedAt: null })); render(); }, 'data');
      toast('Moved ' + plan.title + ' to tomorrow');
    } else if (action === 'duplicate') {
      transition(() => { Store.putPlan(Object.assign({}, plan, { id: C.newId(), done: false, completedAt: null, createdAt: new Date().toISOString() })); render(); }, 'data');
      toast('Duplicated ' + plan.title);
    } else if (action === 'delete') {
      transition(() => { Store.deletePlan(id); render(); }, 'data');
      toast('Deleted ' + plan.title);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!menuLayer.hidden) closeMenu(); else if (sheetKind) closeSheet(); }
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('card')) { e.preventDefault(); const p = state.plans.get(e.target.dataset.id); if (p) openEditor(p); }
  });

  // long press on cards
  let pressTimer = 0, pressStart = null, suppressClick = false;
  document.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('.check') || e.button > 0) return;
    pressStart = { x: e.clientX, y: e.clientY };
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { suppressClick = true; openMenu(card.dataset.id, card); }, 480);
  });
  document.addEventListener('pointermove', (e) => {
    if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 8) { clearTimeout(pressTimer); pressStart = null; }
  });
  for (const ev of ['pointerup', 'pointercancel']) {
    document.addEventListener(ev, () => {
      clearTimeout(pressTimer);
      pressStart = null;
      if (suppressClick) setTimeout(() => { suppressClick = false; }, 400);
    });
  }
  document.addEventListener('contextmenu', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    openMenu(card.dataset.id, card);
  });

  // ---------- actions ----------
  function toggleDone(id) {
    const plan = state.plans.get(id);
    if (!plan) return;
    const done = !plan.done;
    haptic();
    document.querySelectorAll('.check[data-id="' + id + '"]').forEach((b) => {
      b.classList.toggle('is-done', done);
      const card = b.closest('.card');
      if (card) card.classList.toggle('done', done);
    });
    holdUntil = Date.now() + 650;
    Store.putPlan(Object.assign({}, plan, { done, completedAt: done ? new Date().toISOString() : null }));
    if (done) toast('Nice — ' + plan.title + ' is done');
    setTimeout(() => transition(() => render(), 'data'), 650);
  }
  function brief() {
    if (Voice.speaking) { Voice.stop(); return; }
    const now = new Date();
    Voice.speak(Briefing.greeting(now, state.settings.name) + '. ' + Briefing.today(dayAgenda(now), now));
  }
  function addPlan() {
    const day = state.tab === 'week' ? state.selected : new Date();
    openEditor(null, Agenda.suggestedStart(day, new Date()));
  }
  function loadSample() {
    const plans = C.sampleWeek(new Date());
    window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    transition(() => { for (const p of plans) Store.putPlan(p); render({ enter: !supportsVT }); }, 'data');
    toast('Loaded a sample week');
  }
  let wipeArmed = 0;
  function wipe(btn) {
    if (!state.plans.size) { toast('There are no plans to delete.'); return; }
    if (!wipeArmed) {
      wipeArmed = setTimeout(() => { wipeArmed = 0; if (btn.isConnected) $('.label', btn).textContent = 'Delete all plans'; }, 3000);
      $('.label', btn).textContent = 'Tap again to delete ' + Fmt.count(state.plans.size, 'plan');
      haptic();
      return;
    }
    clearTimeout(wipeArmed);
    wipeArmed = 0;
    for (const id of Array.from(state.plans.keys())) Store.deletePlan(id);
    render();
    toast('All plans deleted');
  }
  async function exportBackup() {
    const text = JSON.stringify({ app: 'jarvis', exportedAt: new Date().toISOString(), plans: plansList().map((p) => { const c = Object.assign({}, p); delete c._local; return c; }) });
    try { await navigator.clipboard.writeText(text); toast('Backup copied — paste it somewhere safe'); }
    catch (e) {
      openSheet('backup', '<div class="sheet-head"><button class="round big" data-action="close-sheet" aria-label="Close">' + icon('x') + '</button><h2>Backup</h2><span></span></div>' +
        '<div class="sheet-scroll"><div class="form"><p class="note">Copy this text and keep it somewhere safe.</p><div class="box pane"><textarea class="notes" id="backup-text" style="min-height:260px" readonly aria-label="Backup text"></textarea></div></div></div>', 'Backup', (root) => {
        const t = $('#backup-text', root); t.value = text; setTimeout(() => { t.focus(); t.select(); }, 400); return null;
      });
    }
  }

  document.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { switchTab(tab.dataset.tab); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    switch (action) {
      case 'toggle': e.stopPropagation(); toggleDone(el.dataset.id); break;
      case 'edit': { const p = state.plans.get(el.dataset.id); if (p) openEditor(p); break; }
      case 'add': addPlan(); break;
      case 'ask': openAsk(); break;
      case 'brief': brief(); break;
      case 'brief-week': {
        if (Voice.speaking) { Voice.stop(); break; }
        Voice.speak(Briefing.week(weekData(), new Date()));
        break;
      }
      case 'close-sheet': closeSheet(); break;
      case 'week-prev': changeWeek(-1); break;
      case 'week-next': changeWeek(1); break;
      case 'day': selectDay(Number(el.dataset.index)); break;
      case 'sample': loadSample(); break;
      case 'clear-done': {
        const done = plansList().filter((p) => p.done);
        if (!done.length) { toast('No completed plans to clear.'); break; }
        for (const p of done) Store.deletePlan(p.id);
        render();
        toast('Cleared ' + Fmt.count(done.length, 'completed plan'));
        break;
      }
      case 'export': exportBackup(); break;
      case 'import': openRestore(); break;
      case 'wipe': wipe(el); break;
      case 'test-voice': {
        const n = (state.settings.name || '').trim();
        Voice.speak(n ? 'At your service, ' + n + '.' : 'At your service.');
        break;
      }
      default: break;
    }
  });

  // ---------- boot ----------
  Store.loadLocal();
  const savedTab = Store.readPref('tab', 'today');
  if (['today', 'week', 'settings'].includes(savedTab)) state.tab = savedTab;
  for (const [name, el] of Object.entries(views)) el.hidden = name !== state.tab;
  setupDock();
  render({ enter: true });
  Orbs.start();
  Store.connect();

  let lastMinute = new Date().getMinutes();
  setInterval(() => {
    const m = new Date().getMinutes();
    if (m !== lastMinute && !sheetKind && menuLayer.hidden) { lastMinute = m; scheduleRender(); }
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
